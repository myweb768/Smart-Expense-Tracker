<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/ExpenseFav.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./Icons/css/all.min.css">
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="style.css">
    <title>Smart Expense Tracker</title>
</head>
<body>
    <header class="md:flex items-center justify-around p-4 bg-gray-800 text-white  shadow-md">
        <h2>Smart Expense Tracker</h2>
        <div class="clock">
            <i class="fa-solid fa-calendar-days"></i><span id="myDate"></span>
            <i class="fa-regular fa-clock"></i><span id="myClock"></span></div>
        <div class="user">Omar Faruque</div>
    </header>
    <sidebar></sidebar>
    <main>
        <section class="StatusBox md:grid md:grid-cols-3 gap-4 p-4">
            <div class="TotalMonth flex flex-col items-center justify-center glass-card  border border-gray-600 rounded-md p-4">
                <h2 class="text-xl font-semibold text-center w-full text-gray-700">Total Month</h2>
                <span></span>
                <button type="button" class="w-full m-4 p-2 rounded-xl bg-blue-500 hover:bg-amber-50 hover:scale-105 transition-all duration-300 ease-in-out font-semibold" id="monthHistory">Total Month</button>
            </div>
            <div class="TotalExpense flex flex-col items-center justify-center glass-card border border-gray-600 rounded-md p-4">
                <h2 class="text-xl font-semibold text-center w-full text-gray-700">Total Expense</h2>
                <span></span>
                <button type="button" class="w-full m-4 p-2 rounded-xl bg-yellow-500 hover:bg-amber-50 hover:scale-105 transition-all duration-300 ease-in-out font-semibold" id="expenseHistory">Total Expense</button>
            </div>
            <div class="TotalIncome flex flex-col items-center justify-center glass-card border border-gray-600 rounded-md p-4">
                <h2 class="text-xl font-semibold text-center w-full text-gray-700">Total Income</h2>
                <span></span>
                <button type="button" class="w-full m-4 p-2 rounded-xl bg-green-500 hover:bg-amber-50 hover:scale-105 transition-all duration-300 ease-in-out font-semibold" id="incomeHistory">Total Income</button>
            </div>
        </section>
        <section class="ExpenseForm hidden top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full p-4 flex flex-col justify-center items-center">
                <form class="glass-card border border-gray-600 rounded-md p-4 md:w-1/2">
                    <h2 class="text-xl font-bold mb-4">Add New Expense</h2>
                    <div class="mb-4">
                        <label for="exTitle" class="block text-sm font-medium mb-1">Title</label>
                        <input type="text" id="exTitle" name="exTitle" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="New Spending Title">
                    </div>
                    <div class="mb-4">
                        <label for="exAmount" class="block text-sm font-medium mb-1">Amount</label>
                        <input type="number" id="exAmount" name="exAmount" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Amount of Spending">
                    </div>
                    <div class="mb-4">
                        <label for="exDate" class="block text-sm font-medium mb-1">Date</label>
                        <input type="date" id="exDate" name="exDate" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="btns flex items-center justify-center">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-200">Add Expense</button>
                    <button type="reset" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition duration-200 ml-2">Clear</button>
                    <button type="button" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition duration-200 ml-2" id="closeForm">Close</button>
                    </div> 

                </form>
        </section>

                <section class="IncomeForm hidden top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full p-4 flex flex-col justify-center items-center">
                <form class="glass-card border border-gray-600 rounded-md p-4 md:w-1/2">
                    <h2 class="text-xl font-bold mb-4">Add New Income</h2>
                    <div class="mb-4">
                        <label for="inTitle" class="block text-sm font-medium mb-1">Title</label>
                        <input type="text" id="inTitle" name="inTitle" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="New Income Title">
                    </div>
                    <div class="mb-4">
                        <label for="inAmount" class="block text-sm font-medium mb-1">Amount</label>
                        <input type="number" id="inAmount" name="inAmount" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Amount of Income">
                    </div>
                    <div class="mb-4">
                        <label for="inDate" class="block text-sm font-medium mb-1">Date</label>
                        <input type="date" id="inDate" name="inDate" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="btnsInc flex items-center justify-center">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-200">Add Income</button>
                    <button type="reset" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition duration-200 ml-2">Clear</button>
                    <button type="button" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition duration-200 ml-2" id="inCloseForm">Close</button>
                    </div> 

                </form>
        </section>

        <section class="ExpenseList p-4" id="expenseTableSection">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="border-b p-2 text-center">Title</th>
                            <th class="border-b p-2 text-center">Amount</th>
                            <th class="border-b p-2 text-center">Date</th>
                            <th class="border-b p-2 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                        <!-- Expense items will be dynamically added here -->
                    </tbody>
                </table>
        </section>


        <section class="IncomeList p-4 hidden" id="incomeTableSection">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="border-b p-2 text-center">Source</th>
                            <th class="border-b p-2 text-center">Amount</th>
                            <th class="border-b p-2 text-center">Date</th>
                            <th class="border-b p-2 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="incomeTableBody">
                        <!-- Expense items will be dynamically added here -->
                    </tbody>
                </table>
        </section>

        

    </main>

    
    <button  class="addItem fixed bottom-4 right-4 p-4 z-50 h-12 w-12 flex items-center justify-center rounded-full bg-gray-700 text-4xl font-bold text-white border hover:scale-105 hover:bg-green-500 hover:text-black transition-all duration-300 ease-in-out" id="addExpenseBtn">+</button>
    <button  class="hidden addIcome fixed bottom-4 right-4 p-4 z-50 h-12 w-12 flex items-center justify-center rounded-full bg-amber-700 text-4xl font-bold text-white border hover:scale-105 hover:bg-green-500 hover:text-black transition-all duration-300 ease-in-out" id="addIncomeBtn">+</button>


    <script src="./script.js"></script>
    <script src="./Icons/js/all.min.js"></script>
</body>
</html>
