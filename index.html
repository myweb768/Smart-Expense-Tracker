<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/ExpenseFav.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./Icons/css/all.min.css">
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="style.css">
    <title>Smart Expense Tracker</title>
</head>
<body>
    <header class="md:flex items-center justify-around p-4 bg-gray-800 text-white  shadow-md">
        <h2>Smart Expense Tracker</h2>
        <div class="clock"><i class="fa-regular fa-clock"></i><span id="myClock"></span></div>
        <div class="user">Omar Faruque</div>
    </header>
    <sidebar></sidebar>
    <main>
        <section class="StatusBox md:grid md:grid-cols-3 gap-4 p-4">
            <div class="TotalMonth glass-card  border border-gray-600 rounded-md p-4">
                <h2>Total Month</h2>
                <span></span>
            </div>
            <div class="TotalExpense glass-card border border-gray-600 rounded-md p-4">
                <h2>Total Expense</h2>
                <span></span>
            </div>
            <div class="TotalIncome glass-card border border-gray-600 rounded-md p-4">
                <h2>Total Income</h2>
                <span></span>
            </div>
        </section>
        <section class="ExpenseForm hidden top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full p-4 flex flex-col justify-center items-center">
                <form class="glass-card border border-gray-600 rounded-md p-4 md:w-1/2">
                    <h2 class="text-xl font-bold mb-4">Add New Expense</h2>
                    <div class="mb-4">
                        <label for="title" class="block text-sm font-medium mb-1">Title</label>
                        <input type="text" id="title" name="title" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="New Spending Title">
                    </div>
                    <div class="mb-4">
                        <label for="amount" class="block text-sm font-medium mb-1">Amount</label>
                        <input type="number" id="amount" name="amount" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Amount of Spending">
                    </div>
                    <div class="mb-4">
                        <label for="date" class="block text-sm font-medium mb-1">Date</label>
                        <input type="date" id="date" name="date" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="btns flex items-center justify-center">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-200">Add Expense</button>
                    <button type="reset" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition duration-200 ml-2">Clear</button>
                    <button type="button" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition duration-200 ml-2">Close</button>
                    </div> 
        </section>
        <section class="ExpenseList p-4">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="border-b p-2 text-center">Title</th>
                            <th class="border-b p-2 text-center">Amount</th>
                            <th class="border-b p-2 text-center">Date</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                        <!-- Expense items will be dynamically added here -->
                    </tbody>
                </table>
        </section>

        

    </main>
<footer></footer>


    <script src="./script.js"></script>
    <script src="./Icons/js/all.min.js"></script>
</body>
</html>
